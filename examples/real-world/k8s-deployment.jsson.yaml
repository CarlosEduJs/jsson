configMaps:
    - apiVersion: v1
      cacheTTL: "3600"
      databaseHost: postgres-prod.internal
      featureFlags: stable
      kind: ConfigMap
      name: app-config-prod
      namespace: prod
      redisHost: redis-prod.internal
    - apiVersion: v1
      cacheTTL: "60"
      databaseHost: postgres-staging.internal
      featureFlags: experimental
      kind: ConfigMap
      name: app-config-staging
      namespace: staging
      redisHost: redis-staging.internal
    - apiVersion: v1
      cacheTTL: "60"
      databaseHost: postgres-dev.internal
      featureFlags: experimental
      kind: ConfigMap
      name: app-config-dev
      namespace: dev
      redisHost: redis-dev.internal
deployments:
    - apiVersion: apps/v1
      cpuLimit: 1000m
      cpuRequest: 500m
      environment: prod
      image: myregistry/api:stable
      kind: Deployment
      logLevel: error
      memoryLimit: 1Gi
      memoryRequest: 512Mi
      name: api-prod
      namespace: prod
      replicas: 5
    - apiVersion: apps/v1
      cpuLimit: 1000m
      cpuRequest: 500m
      environment: prod
      image: myregistry/web:stable
      kind: Deployment
      logLevel: error
      memoryLimit: 1Gi
      memoryRequest: 512Mi
      name: web-prod
      namespace: prod
      replicas: 3
    - apiVersion: apps/v1
      cpuLimit: 1000m
      cpuRequest: 500m
      environment: prod
      image: myregistry/worker:stable
      kind: Deployment
      logLevel: error
      memoryLimit: 1Gi
      memoryRequest: 512Mi
      name: worker-prod
      namespace: prod
      replicas: 4
    - apiVersion: apps/v1
      cpuLimit: 500m
      cpuRequest: 250m
      environment: staging
      image: myregistry/api:latest
      kind: Deployment
      logLevel: debug
      memoryLimit: 512Mi
      memoryRequest: 256Mi
      name: api-staging
      namespace: staging
      replicas: 2
    - apiVersion: apps/v1
      cpuLimit: 500m
      cpuRequest: 250m
      environment: staging
      image: myregistry/web:latest
      kind: Deployment
      logLevel: debug
      memoryLimit: 512Mi
      memoryRequest: 256Mi
      name: web-staging
      namespace: staging
      replicas: 2
    - apiVersion: apps/v1
      cpuLimit: 500m
      cpuRequest: 250m
      environment: staging
      image: myregistry/worker:latest
      kind: Deployment
      logLevel: debug
      memoryLimit: 512Mi
      memoryRequest: 256Mi
      name: worker-staging
      namespace: staging
      replicas: 1
    - apiVersion: apps/v1
      cpuLimit: 500m
      cpuRequest: 250m
      environment: dev
      image: myregistry/api:latest
      kind: Deployment
      logLevel: debug
      memoryLimit: 512Mi
      memoryRequest: 256Mi
      name: api-dev
      namespace: dev
      replicas: 1
    - apiVersion: apps/v1
      cpuLimit: 500m
      cpuRequest: 250m
      environment: dev
      image: myregistry/web:latest
      kind: Deployment
      logLevel: debug
      memoryLimit: 512Mi
      memoryRequest: 256Mi
      name: web-dev
      namespace: dev
      replicas: 1
    - apiVersion: apps/v1
      cpuLimit: 500m
      cpuRequest: 250m
      environment: dev
      image: myregistry/worker:latest
      kind: Deployment
      logLevel: debug
      memoryLimit: 512Mi
      memoryRequest: 256Mi
      name: worker-dev
      namespace: dev
      replicas: 1
services:
    - apiVersion: v1
      app: api
      environment: prod
      kind: Service
      name: api-prod
      namespace: prod
      port: 8080
      protocol: TCP
      targetPort: 8080
      type: LoadBalancer
    - apiVersion: v1
      app: web
      environment: prod
      kind: Service
      name: web-prod
      namespace: prod
      port: 3000
      protocol: TCP
      targetPort: 3000
      type: LoadBalancer
    - apiVersion: v1
      app: api
      environment: staging
      kind: Service
      name: api-staging
      namespace: staging
      port: 8080
      protocol: TCP
      targetPort: 8080
      type: ClusterIP
    - apiVersion: v1
      app: web
      environment: staging
      kind: Service
      name: web-staging
      namespace: staging
      port: 3000
      protocol: TCP
      targetPort: 3000
      type: ClusterIP
    - apiVersion: v1
      app: api
      environment: dev
      kind: Service
      name: api-dev
      namespace: dev
      port: 8080
      protocol: TCP
      targetPort: 8080
      type: ClusterIP
    - apiVersion: v1
      app: web
      environment: dev
      kind: Service
      name: web-dev
      namespace: dev
      port: 3000
      protocol: TCP
      targetPort: 3000
      type: ClusterIP

