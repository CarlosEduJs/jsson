version: "2"

linters:
  default: none
  enable:
    # Bugs & correctness
    - errcheck
    - govet
    - staticcheck
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gosec
    - ineffassign
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - reassign
    - unconvert
    - unparam
    - unused
    - wastedassign
    # Style & maintainability
    - asciicheck
    - bidichk
    - canonicalheader
    - copyloopvar
    - decorder
    - dogsled
    - dupword
    - errname
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - godox
    - goprintffuncname
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - intrange
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - recvcheck
    - revive
    - sloglint
    - tagalign
    - testifylint
    - thelper
    - tparallel
    - usestdlibvars
    - usetesting
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    staticcheck:
      checks:
        - all
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    misspell:
      locale: US
    forcetypeassert:
      enable: false
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - funlen
          - gocognit
          - lll
          - mnd
          - wrapcheck
      - path: _test\.go
        text: "gochecknoglobals"
      - linters:
          - staticcheck
        text: "SA9003:"
      - linters:
          - lll
        source: "^//go:generate "
    paths:
      - ".*\\.pb\\.go$"
      - ".*\\.pb\\.gw\\.go$"

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  fix: false

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
  sort-order:
    - linter
    - file
  show-stats: true

run:
  timeout: 5m
  relative-path-mode: gomod
  issues-exit-code: 1
  tests: true
  go: "1.22"
  concurrency: 4
  allow-parallel-runners: true
